<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whiteboard</title>
    <link rel="stylesheet" href="board.css" />
  </head>
  <body class="wb-panel">
    <div class="wb-mini-view">
      <div id="mini" class="wb wb--mini" role="img">
        <canvas id="mini-canvas" class="wb-layer" aria-hidden="true"></canvas>
        <div id="cursors" class="wb-cursors"></div>
      </div>
      <div class="wb-mini-view__bar">
        <span class="wb-live-dot" aria-hidden="true"></span><span id="live-text"></span>
        <button id="open" class="wb-link" type="button"></button>
      </div>
      <div class="wb-quick">
        <label id="quick-label" class="wb-quick__label" for="quick"></label>
        <div class="wb-quick__row">
          <input id="quick" class="wb-quick__input" type="text" maxlength="500" aria-describedby="quick-hint" />
          <button id="quick-add" class="wb-button" type="button"></button>
        </div>
        <span id="quick-hint" class="wb-muted"></span>
      </div>
      <h3 id="people-title" class="wb-h3"></h3>
      <ul id="people" class="wb-plist"></ul>
    </div>
    <div id="announce" class="sr-only" aria-live="polite"></div>
    <script type="module" src="mini.js"></script>
  </body>
</html>
