<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whiteboard</title>
    <link rel="stylesheet" href="board.css" />
  </head>
  <body>
    <div id="strip" class="wb-strip" role="status" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z" /><path d="M12 10v5M12 18v.01" /></svg>
      <span><b id="strip-title"></b> <span id="strip-body"></span><span id="strip-why-text" class="wb-strip__why" hidden></span></span>
      <button id="strip-why" class="wb-banner__btn" type="button" aria-expanded="false" aria-controls="strip-why-text"></button>
    </div>
    <div id="wb" class="wb" role="application" tabindex="0">
      <canvas id="scene" class="wb-layer" aria-hidden="true"></canvas>
      <canvas id="overlay" class="wb-layer wb-layer--top" aria-hidden="true"></canvas>
      <div id="cursors" class="wb-cursors"></div>
      <div id="lasers" class="wb-lasers" aria-hidden="true"></div>
      <div id="kbcursor" class="wb-bobpen" aria-hidden="true" hidden></div>
      <textarea id="editor" class="wb-editor" hidden></textarea>
      <!-- The outline comes right after the board in the tab order: Tab from the canvas reaches the objects. -->
      <section id="outline" class="wb-outline glass" aria-labelledby="outline-title">
        <h2 id="outline-title"></h2>
        <p id="outline-empty" hidden></p>
        <ul id="outline-tree" role="tree" aria-labelledby="outline-title"></ul>
        <label><span id="outline-filter-label"></span><select id="outline-filter"></select></label>
      </section>
      <div id="toolbar" class="wb-toolbar" role="toolbar" aria-orientation="vertical"></div>
      <div class="wb-top">
        <div id="props" class="wb-props" role="group" hidden></div>
        <div id="readonly" class="wb-readonly glass" role="status" hidden></div>
        <div id="actions" class="wb-actions" role="toolbar"></div>
      </div>
      <div id="banner" class="wb-banner glass" hidden></div>
      <div id="presentbar" class="wb-presentbar glass" role="toolbar" hidden></div>
      <div id="zoom" class="wb-zoom" role="group"></div>
      <span id="saved" class="wb-saved glass" hidden></span>
      <div id="queue" class="wb-queue glass" role="status" hidden>
        <span id="queue-text"></span><span class="wb-queue__bar"><i id="queue-bar"></i></span>
      </div>
    </div>
    <div id="announce" class="sr-only" aria-live="polite"></div>
    <dialog id="help" class="wb-dialog" aria-labelledby="help-title">
      <h2 id="help-title"></h2>
      <dl id="help-keys" class="wb-keys"></dl>
      <button id="help-close" class="wb-dialog__close" type="button"></button>
    </dialog>
    <script type="module" src="board.js"></script>
  </body>
</html>
