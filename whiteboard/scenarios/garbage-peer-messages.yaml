# Untrusted board data from other users never crashes the plugin, with or without a board open.
name: Garbage board messages are dropped
grant: [ui.stage, ui.webview, ui.app-menu, ui.dialog, peers.messages, events.presence, random.bytes, ui.chat-card]
me: {session: 1, name: Alice}
peers:
  - {session: 2, name: Bob}

steps:
  - event: {peer-message: {from: 2, kind: 6, hex: "01 abab"}}
  - event: {peer-message: {from: 2, kind: 2, hex: "ff ff ff ff ff ff ff ff ff ff ff"}}
  - event: {peer-message: {from: 2, kind: 99, text: "hello"}}
  - event: {peer-message: {from: 2, kind: 1, hex: ""}}
  - expect: nothing
  # Still alive: a real announcement afterwards works.
  - event: {peer-message: {from: 2, kind: 6, hex: "2e763d313b2e6d73673d7b2e643d2254652671345465267134546526713454652671343177265d797a754834793046354b5a25677935223b2e6b3d363b7d3b"}}
  - expect: {tree: {slot: {chat-card: wb-1}, text: "Bob started a whiteboard"}}
