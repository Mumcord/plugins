# Bob announces board "Plan" (BOARD, kind 6): Alice, who is not on a board, gets an invite card.
# Payload: the Bovnar document .v=1;.msg={.d="…";.k=6;}; whose base-85 body holds the board id
# (16 × ab), title "Plan", host author key and start time (varint ms).
name: A board announcement shows an invite card
grant: [ui.stage, ui.webview, ui.app-menu, ui.dialog, peers.messages, events.presence, random.bytes, ui.chat-card]
me: {session: 1, name: Alice}
peers:
  - {session: 2, name: Bob}

steps:
  - event: {peer-message: {from: 2, kind: 6, hex: "2e763d313b2e6d73673d7b2e643d2254652671345465267134546526713454652671343177265d797a754834793046354b5a25677935223b2e6b3d363b7d3b"}}
  - expect: {tree: {slot: {chat-card: wb-1}, text: "Bob started a whiteboard"}}
  # The same board again only updates the card; no second card appears.
  - event: {peer-message: {from: 2, kind: 6, hex: "2e763d313b2e6d73673d7b2e643d2254652671345465267134546526713454652671343177265d797a754834793046354b5a25677935223b2e6b3d363b7d3b"}}
  - expect: {tree: {slot: {chat-card: wb-1}, text: "Plan"}}
  - expect: nothing
