# Bob posted the "[Whiteboard] … started a whiteboard" line and tells the channel its hash
# (kind 0x20: format 1, line 0 = start, hash u32 LE, board id). Alice's Mumcord shows the invite
# card in its place (chat.supersede).
name: A plain-text start line is replaced by the invite card
grant: [ui.stage, ui.webview, ui.app-menu, ui.dialog, peers.messages, events.presence, random.bytes, ui.chat-card, chat.supersedes]
me: {session: 1, name: Alice}
peers:
  - {session: 2, name: Bob}

steps:
  - event: {peer-message: {from: 2, kind: 32, hex: "01 00 78563412 abababababababababababababababab"}}
  - expect: {tree: {slot: {chat-card: wb-1}, text: "Bob started a whiteboard"}}
  # A malformed notice (wrong length) is dropped.
  - event: {peer-message: {from: 2, kind: 32, hex: "01 00 7856"}}
  - expect: {log: {contains: dropped a malformed chat line notice}}
