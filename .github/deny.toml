# Licence scan of a plugin's Rust dependencies (policy/REVIEW.md). Used by .github/scripts/registry.py.
[graph]
targets = ["wasm32-unknown-unknown"]

[licenses]
# OSI-approved licences only. Unicode-3.0 covers the Unicode data tables many crates bundle.
allow = [
  "0BSD", "AGPL-3.0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "BSL-1.0", "EUPL-1.2", "GPL-2.0", "GPL-3.0", "ISC", "LGPL-2.1", "LGPL-3.0",
  "MIT", "MPL-2.0", "Unicode-3.0", "Unlicense", "Zlib",
]
confidence-threshold = 0.9
# The allow-list is shared by all plugins; most use only a few of these.
unused-allowed-license = "allow"

[licenses.private]
# The plugin crate itself is checked through manifest.json; it is usually not published.
ignore = true
