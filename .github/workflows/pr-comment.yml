# Posts the permission diff from the Check workflow as one sticky pull request comment.
# Runs with write access in the base repository, so it never checks out or runs pull request code;
# it only reads the uploaded Markdown and checks that it belongs to the pull request's head commit.
name: Permission diff comment
on:
  workflow_run:
    workflows: [Check]
    types: [completed]
permissions:
  actions: read
  pull-requests: write
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: permission-diff
          path: diff
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(tr -dc '0-9' < diff/pr-number)
          test -n "$pr" || { echo "::error::no pull request number"; exit 1; }
          head=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "Pull request #$pr moved on to another commit; skipping."
            exit 0
          fi
          marker='<!-- mumcord-permission-diff -->'
          existing=$(gh api --paginate "repos/$REPO/issues/$pr/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)
          if [ ! -s diff/comment.md ]; then
            echo "No registry changes in this pull request."
            exit 0
          fi
          # Keep the marker first so the next run finds and updates this comment.
          { echo "$marker"; grep -vF "$marker" diff/comment.md; } > body.md
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@body.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$pr/comments" -F body=@body.md > /dev/null
          fi
