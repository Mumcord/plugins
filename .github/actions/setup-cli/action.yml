name: Set up mumcord-plugin
description: Installs the Rust toolchain with the plugin target and the mumcord-plugin CLI (cached per CLI commit).
inputs:
  ref:
    description: >-
      Branch or tag of Mumcord/mumcord the CLI is installed from. Empty: the first line of
      .github/mumcord-cli-ref.
    default: ''
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Resolve CLI commit
      id: cli
      shell: bash
      env:
        REF: ${{ inputs.ref }}
      run: |
        # The CLI of the 1.1 registry (site-data with v1.1) is not released yet, so it is built from
        # a branch. The pin moves to the tag v0.7.0 when that release ships (README, "CLI pin").
        [ -n "$REF" ] || REF=$(head -n 1 "$GITHUB_WORKSPACE/.github/mumcord-cli-ref" | tr -d '[:space:]')
        test -n "$REF" || { echo "::error::no CLI ref: .github/mumcord-cli-ref is empty"; exit 1; }
        # `^{}` resolves an annotated tag to its commit; a branch has no such line.
        commit=$(git ls-remote https://github.com/Mumcord/mumcord.git "refs/heads/$REF" "refs/tags/$REF" "refs/tags/$REF^{}" | tail -n 1 | cut -f1)
        test -n "$commit" || { echo "::error::$REF not found in Mumcord/mumcord"; exit 1; }
        echo "Installing mumcord-plugin from $REF ($commit)"
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      id: cache
      with:
        path: ~/.cargo/bin/mumcord-plugin
        key: mumcord-plugin-${{ runner.os }}-${{ steps.cli.outputs.commit }}
    - name: Install mumcord-plugin
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        COMMIT: ${{ steps.cli.outputs.commit }}
      run: cargo install --locked --quiet --git https://github.com/Mumcord/mumcord.git --rev "$COMMIT" mumcord-plugin
