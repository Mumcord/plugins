[summary]
bg = "Мъничко създание от звук, което расте, докато прекарваш време с приятели. Никога не умира и никога не досажда."
cs = "Malý tvoreček ze zvuku, který roste, když trávíš čas s přáteli. Nikdy neumře a nikdy nenaléhá."
da = "Et lille væsen af lyd, der vokser, mens du hænger ud med venner. Det dør aldrig og pjatter aldrig."
de = "Ein kleines Wesen aus Klang, das wächst, wenn du mit Freunden abhängst. Es stirbt nie und nervt nie."
el = "Ένα μικρό πλάσμα φτιαγμένο από ήχο, που μεγαλώνει όσο περνάς χρόνο με φίλους. Δεν πεθαίνει ποτέ και δεν γκρινιάζει ποτέ."
en = "A little creature made of sound that grows while you hang out with friends. It never dies and never nags."
es = "Una criatura diminuta hecha de sonido que crece mientras pasas el rato con tus amigos. Nunca muere y nunca da la lata."
et = "Väike helist tehtud olevus, kes kasvab, kui veedad aega sõpradega. Ta ei sure kunagi ega tüüta kunagi."
fi = "Pieni äänestä tehty otus, joka kasvaa, kun vietät aikaa kavereiden kanssa. Se ei koskaan kuole eikä koskaan marise."
fr = "Une petite créature faite de son qui grandit quand tu passes du temps avec tes amis. Elle ne meurt jamais et ne te harcèle jamais."
ga = "Créatúr beag déanta as fuaim a fhásann agus tú ag caitheamh ama le cairde. Ní bhásaíonn sé choíche agus ní bhíonn sé ag cur isteach ort choíche."
hr = "Maleno stvorenje od zvuka koje raste dok se druži s prijateljima. Nikad ne umire i nikad ne dosađuje."
hu = "Egy aprócska, hangból született lény, amely nő, amíg a barátaiddal lógsz. Sosem hal meg, és sosem nyaggat."
it = "Una piccola creatura fatta di suono che cresce mentre passi il tempo con gli amici. Non muore mai e non rompe mai."
lt = "Mažytė būtybė iš garso, kuri auga, kai leidi laiką su draugais. Ji niekada nemiršta ir niekada nekankina."
lv = "Maza skaņas radība, kas aug, kamēr pavadi laiku ar draugiem. Tā nekad nemirst un nekad neuzbāžas."
mt = "Kreatura żgħira magħmula mill-ħoss li tikber waqt li tqatta' l-ħin mal-ħbieb. Qatt ma timmut u qatt ma tgerger."
nl = "Een klein wezentje van geluid dat groeit terwijl je met vrienden optrekt. Het gaat nooit dood en zeurt nooit."
pl = "Maleńkie stworzenie z dźwięku, które rośnie, gdy spędzasz czas ze znajomymi. Nigdy nie umiera i nigdy nie marudzi."
pt = "Uma criaturinha feita de som que cresce enquanto passas tempo com os amigos. Nunca morre e nunca chateia."
ro = "O mică creatură făcută din sunet, care crește cât timp petreci timp cu prietenii. Nu moare niciodată și nu te sâcâie niciodată."
sk = "Malé stvorenie zo zvuku, ktoré rastie, keď trávite čas s priateľmi. Nikdy neumrie a nikdy neotravuje."
sl = "Majhno bitje iz zvoka, ki raste, medtem ko preživljaš čas s prijatelji. Nikoli ne umre in nikoli ne nergá."
