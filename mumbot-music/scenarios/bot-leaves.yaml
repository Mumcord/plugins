# When the bot leaves the channel the dialog says so, and the setup form returns with it.
name: Bot leaves and returns
me: {session: 1, name: Alice}
peers:
  - {session: 2, name: Mumbot}

steps:
  - event: {user-menu-requested: 2}
  - expect: {tree: {slot: dialog, text: "This bot is not set up yet"}}
  - event: {left: 2}
  - expect: {tree: {slot: dialog, text: "Mumbot is not in your channel"}}
  - event: {joined: 2}
  - expect: {tree: {slot: dialog, text: "This bot is not set up yet"}}
